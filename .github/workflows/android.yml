name: Android CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    # Needed by the Kover PR-comment step to post/update a comment.
    permissions:
      contents: read
      pull-requests: write

    defaults:
      run:
        working-directory: android

    steps:
      - uses: actions/checkout@v5

      # GATE: documentation + convention checks (features/_foundations/rules.md).
      # Dependency-free and sub-second, so it runs first — a dangling rule
      # citation or a log call in a PII-bearing layer fails here in seconds
      # instead of after JDK + SDK setup and a full Gradle run. The
      # requirement-ID leg is a ratchet against scripts/conventions-baseline.json:
      # pre-existing debt is tolerated, growing it is not.
      - name: Conventions + docs
        working-directory: .
        run: python3 scripts/check-conventions.py

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      # Android SDK used by assembleDebug — setup-android@v4 adds cmdline-tools
      # and writes local.properties under the working dir for us.
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platforms;android-35 build-tools;35.0.0

      # Advisory: the codebase predates this strict ktlint config and does not
      # yet fully conform (many findings, including some not auto-correctable).
      # ktlint still runs and reports here, but does not block the build — the
      # enforced gates are the unit tests, coverage, and assemble steps below.
      # Formatting can be auto-applied locally via the pre-commit hook
      # (git config core.hooksPath .githooks).
      - name: ktlint (advisory)
        continue-on-error: true
        run: ./gradlew :app:ktlintCheck --no-daemon

      # koverXmlReportDebug depends on testDebugUnitTest, so this runs the unit
      # tests AND produces the unified coverage report in one pass.
      - name: Unit tests + coverage
        run: ./gradlew :app:koverXmlReportDebug :app:koverHtmlReportDebug --no-daemon

      # Retried tests. The test-retry plugin reruns a failed method up to twice
      # and, with failOnPassedAfterRetry false, a pass on retry counts as a
      # pass, so the build cannot go red for the WorkManager-in-Robolectric
      # init flake it exists for. That must not make a flake invisible: every
      # execution of a retried method is in the JUnit XML, so a method that
      # appears more than once in a class report ran again after failing.
      # This lists them (and says "none" otherwise) in the log and the job
      # summary; a recurring name is a test to look at, not a number to ignore.
      - name: Retried tests
        if: always()
        shell: python
        run: |
          import glob, os, xml.etree.ElementTree as ET
          from collections import Counter
          retried = []
          for path in sorted(glob.glob("app/build/test-results/testDebugUnitTest/*.xml")):
              suite = ET.parse(path).getroot()
              runs = Counter((case.get("classname"), case.get("name")) for case in suite.iter("testcase"))
              retried += [f"{cls}.{name} ({n} executions)" for (cls, name), n in sorted(runs.items()) if n > 1]
          lines = ["## Retried tests", ""] + (retried or ["none"])
          print("\n".join(lines))
          for line in retried:
              print(f"::warning::test passed only on retry: {line}")
          summary = os.environ.get("GITHUB_STEP_SUMMARY")
          if summary:
              with open(summary, "a", encoding="utf-8") as out:
                  out.write("\n".join(lines) + "\n")

      - name: Upload coverage report
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: orbit-coverage
          path: android/app/build/reports/kover
          if-no-files-found: warn

      # Per-layer + per-package breakdown into the log, plus a markdown summary
      # for the PR comment. Pure-Python parse of the Kover XML; never fails here.
      - name: Coverage by layer
        if: always()
        continue-on-error: true
        run: python3 scripts/coverage-summary.py --markdown app/build/reports/kover/coverage-summary.md

      # Post the honest per-layer breakdown as a sticky PR comment (leads with the
      # domain figure, not the diluted total). Updates in place; reuses the prior
      # comment slot if present. Self-contained — no third-party action. Runs
      # before the gate so a regression still shows the breakdown on the PR.
      - name: Comment coverage on PR
        if: github.event_name == 'pull_request'
        continue-on-error: true
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('fs');
            const path = 'android/app/build/reports/kover/coverage-summary.md';
            if (!fs.existsSync(path)) { core.warning('no coverage summary to post'); return; }
            const body = fs.readFileSync(path, 'utf8');
            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;
            const { data: comments } = await github.rest.issues.listComments({ owner, repo, issue_number });
            const existing = comments.find(c =>
              c.body.includes('<!-- orbit-coverage -->') || c.body.includes('Total Project Coverage'));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

      # GATE: fail the build if the domain (business-logic) layer regresses below
      # the floor. domain sits at ~97%; 90 leaves headroom for normal churn while
      # catching a real drop. This is the enforced coverage signal — the total is
      # only advisory (it's diluted by UI/nav/DI and on-device-tested data).
      - name: Enforce domain coverage floor
        run: python3 scripts/coverage-summary.py --min-domain 90

      - name: Assemble debug APK
        run: ./gradlew :app:assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v6
        with:
          name: orbit-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  # The preview gallery's audits as a gate (UX rubric G2 and G6). Every
  # @Preview is rendered on the JVM in light and dark and at font scales 0.85
  # to 2.0, and audited as it goes: -Porbit.a11y.strict fails a preview on an
  # enabled control without a TalkBack label or under 48dp (rules.md Design 3
  # and 7); -Porbit.screenshots.curtain renders everything with the privacy
  # curtain down and fails on a fixture name that still reaches text, a field
  # or a label (PRIV-03). Its own job because -Pscreenshots replaces the unit
  # test filter (app/build.gradle.kts), and because several hundred previews
  # in every mode take a while on a hosted runner. It records, it does not
  # compare: approving goldens is the rubric's remaining item 4.1.
  screenshots:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: android

    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platforms;android-35 build-tools;35.0.0

      - name: Preview gallery, strict a11y and curtain audits
        run: ./gradlew :app:testDebugUnitTest -Pscreenshots -Porbit.a11y.strict -Porbit.screenshots.curtain --no-daemon

      # The two reports are the evidence either way: "None" on a green run,
      # the offending previews on a red one.
      - name: Upload audit reports
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: orbit-gallery-audits
          path: |
            android/app/build/screenshots/a11y-report.md
            android/app/build/screenshots/curtain-report.md
          if-no-files-found: warn

  # Instrumented (androidTest) tests on an emulator, reporting their on-device
  # coverage via AGP's native JaCoCo report (Kover does not consume AGP
  # instrumented coverage). This surfaces a separate data/ui "instrumented
  # coverage" figure alongside the unit number from the build job. Non-blocking.
  instrumented:
    runs-on: ubuntu-latest
    continue-on-error: true

    defaults:
      run:
        working-directory: android

    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      # KVM hardware acceleration — required for a usable x86_64 emulator on
      # GitHub-hosted Linux runners.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # Run the instrumented suite, then AGP's native coverage report. The two
      # commands are separate so a flaky test can't block report generation; the
      # report reuses whatever .ec coverage the (cached) test run produced.
      # NOTE: each command must be one physical line — the action passes
      # backslash line-continuations through literally (Gradle saw '\' as a task).
      - name: Instrumented tests + AGP coverage report
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          working-directory: android
          script: |
            ./gradlew -PinstrumentedCoverage :app:connectedDebugAndroidTest --no-daemon || echo "::warning::instrumented tests had failures — continuing"
            ./gradlew -PinstrumentedCoverage :app:createDebugAndroidTestCoverageReport --no-daemon || echo "::warning::coverage report task failed — continuing"

      # Locate AGP's JaCoCo XML (path varies by AGP version) and summarise it by
      # layer. Self-diagnosing: lists the coverage files it finds.
      - name: Instrumented coverage by layer
        if: always()
        continue-on-error: true
        run: |
          echo "== coverage outputs =="
          find app/build/reports/coverage app/build/outputs/code_coverage -type f 2>/dev/null | head -50 || true
          REPORT=$(find app/build/reports/coverage -name '*.xml' 2>/dev/null | head -1)
          if [ -n "$REPORT" ]; then
            echo "== Parsing $REPORT =="
            python3 scripts/coverage-summary.py "$REPORT"
          else
            echo "No instrumented coverage XML found (see listing above)."
          fi

      - name: Upload instrumented coverage report
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: orbit-coverage-instrumented
          path: android/app/build/reports/coverage
          if-no-files-found: warn
