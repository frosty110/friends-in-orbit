name: Release APK

# Builds a sideloadable debug APK and publishes it to a GitHub Release.
#
# Runs automatically on every merge to `main`, so the Releases page always
# carries the latest build — open the newest release on your phone and tap the
# .apk to download + install. No laptop / adb / USB needed. You can also trigger
# it by hand (Actions → "Release APK" → Run workflow) to cut a build off-cycle.
#
# The repo is public, so release assets download without a login — the tap-to-
# install flow works in plain mobile Chrome. The published APK is therefore
# publicly downloadable; that is an accepted trade-off of this approach.
#
# Every build is signed with one shared dev key (the ORBIT_DEV_KEYSTORE_BASE64
# secret), so each installs over the last and keeps the app's data, and an
# updater such as Obtainium can follow the Releases page. Android refuses an
# update signed by a different key. Until 2026-10-07 each run signed with the
# runner's freshly generated debug key, so every build needed an uninstall
# first. If the secret is missing the build still publishes, signed with a
# throwaway key, and says so in a warning and in the release notes.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      note:
        description: "Optional note to show in the release body"
        required: false
        default: ""

# Needed to create the release and push its tag.
permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: android

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platforms;android-35 build-tools;35.0.0

      - name: Compute build metadata
        run: echo "SHORT_SHA=${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      # The shared dev key: app/build.gradle.kts signs debug builds with the
      # file ORBIT_DEV_KEYSTORE names (standard debug credentials inside).
      - name: Use the shared dev signing key
        env:
          ORBIT_DEV_KEYSTORE_BASE64: ${{ secrets.ORBIT_DEV_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$ORBIT_DEV_KEYSTORE_BASE64" ]; then
            KS="${RUNNER_TEMP}/orbit-dev.keystore"
            echo "$ORBIT_DEV_KEYSTORE_BASE64" | base64 --decode > "$KS"
            echo "ORBIT_DEV_KEYSTORE=$KS" >> "$GITHUB_ENV"
            echo "SIGNING_NOTE=Signed with the shared dev key: installs over the previous dev build and keeps your data." >> "$GITHUB_ENV"
          else
            echo "::warning::ORBIT_DEV_KEYSTORE_BASE64 is not set, so this build is signed with a throwaway key and will not install over the previous one."
            echo "SIGNING_NOTE=Signed with a throwaway key (the ORBIT_DEV_KEYSTORE_BASE64 secret is not set): uninstall the previous build first, which deletes Orbit's data unless you export it in Settings." >> "$GITHUB_ENV"
          fi

      - name: Assemble debug APK
        # CI stamps the version so the installed app's Settings → About shows this
        # exact build (see android/app/build.gradle.kts). versionCode = run number
        # (monotonic, Play-safe); versionName = "1.0.0 (build <run> <sha>)".
        env:
          ORBIT_VERSION_CODE: ${{ github.run_number }}
          ORBIT_BUILD_LABEL: build ${{ github.run_number }} ${{ env.SHORT_SHA }}
        run: ./gradlew :app:assembleDebug --no-daemon

      # The certificate fingerprint goes in the release notes, so two builds
      # can be compared at a glance: the same fingerprint means one updates
      # the other.
      - name: Read the signing certificate
        run: |
          APKSIGNER="${ANDROID_HOME}/build-tools/35.0.0/apksigner"
          CERT=$("$APKSIGNER" verify --print-certs app/build/outputs/apk/debug/app-debug.apk \
            | sed -n 's/.*certificate SHA-256 digest: //p' | head -1)
          [ -n "$CERT" ] || { echo "::error::could not read the APK's signing certificate"; exit 1; }
          echo "CERT_SHA256=$CERT" >> "$GITHUB_ENV"

      # Give the asset a distinguishable name so multiple downloads in the
      # browser don't all collide on "app-debug.apk".
      - name: Stage APK
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          cp app/build/outputs/apk/debug/app-debug.apk \
            "${RUNNER_TEMP}/orbit-${{ github.run_number }}-${SHORT_SHA}-debug.apk"
          echo "APK_PATH=${RUNNER_TEMP}/orbit-${{ github.run_number }}-${SHORT_SHA}-debug.apk" >> "$GITHUB_ENV"
          echo "SHORT_SHA=${SHORT_SHA}" >> "$GITHUB_ENV"

      # Publish via the official gh CLI (preinstalled on the runner) — no
      # third-party action. Tag is the run number, so every run is unique and
      # re-runnable. Marked prerelease so these dev builds never become "latest".
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="dev-${{ github.run_number }}"
          gh release create "$TAG" "$APK_PATH" \
            --target "$GITHUB_SHA" \
            --title "Dev build #${{ github.run_number }} (${SHORT_SHA})" \
            --prerelease \
            --notes "Debug APK built from \`${{ github.ref_name }}\` @ \`${SHORT_SHA}\`.

          Install: open this release on your phone and tap the \`.apk\` (allow install from unknown sources once).

          ${SIGNING_NOTE}
          Signing certificate SHA-256: \`${CERT_SHA256}\`

          ${{ inputs.note }}"

      # Best-effort cleanup so the Releases list doesn't grow forever: keep the
      # newest 10 dev-* releases, delete older ones (and their tags). Never fails
      # the build.
      - name: Prune old dev releases
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release list --limit 200 --json tagName,createdAt \
            | jq -r '[.[] | select(.tagName | startswith("dev-"))]
                     | sort_by(.createdAt) | reverse | .[10:] | .[].tagName' \
            | while read -r tag; do
                [ -n "$tag" ] || continue
                echo "Pruning old release $tag"
                gh release delete "$tag" --cleanup-tag --yes || true
              done
